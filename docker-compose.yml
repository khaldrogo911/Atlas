# ==============================================================================
# Project Atlas — local development stack.
#
#   cp .env.example .env      # then fill in POSTGRES_PASSWORD and the four
#                             # ATLAS_BROKER__* values; none of them has a default
#   docker compose config     # validate
#   docker compose up -d
#
# No service carries a default credential, and none is invented here. Compose
# interpolation fails loudly if POSTGRES_PASSWORD or any of the four
# ATLAS_BROKER__* values is unset, rather than falling back to a known value —
# which means `docker compose config` refuses an incomplete `.env` before
# anything starts. A login, a server name, a terminal path and a password are
# facts about a deployment; the repository holds none of them.
# ==============================================================================

name: atlas

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - atlas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    # AOF plus an RDB snapshot rule: the event transport must survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - atlas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  atlas-core:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    # Tag must equal [project].version in pyproject.toml, which is the single
    # source of truth. A contract test enforces this; do not edit one alone.
    image: atlas/atlas-core:0.2.0a0
    container_name: atlas-core
    # Deliberate: a configured atlas-core performs a start-up connectivity check
    # and exits — 0 once it has opened a broker session and closed it again, 3
    # when it could not open one, 2 when the configuration was unusable. A
    # restarting policy would turn a clean exit into a crash loop, and would
    # retry both a broker configuration that cannot open a session and a venue
    # that is simply unreachable, neither of which restarting fixes. ADR-0017
    # decided this process has no run loop; this becomes "unless-stopped" only
    # if some later record gives it one.
    #
    # In this image the check cannot reach a venue at all: MetaTrader5 publishes
    # Windows wheels only, so `docker compose up atlas-core` exits 3 by design.
    # The runbook covers what that means and what it does not.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      ATLAS_CONFIG_DIR: /app/config
      ATLAS_APP_NAME: atlas-core
      ATLAS_LOGGING__LEVEL: ${ATLAS_LOGGING__LEVEL:-INFO}
      ATLAS_LOGGING__FORMAT: ${ATLAS_LOGGING__FORMAT:-json}
      ATLAS_POSTGRES__HOST: postgres
      ATLAS_POSTGRES__PORT: "5432"
      ATLAS_POSTGRES__DATABASE: ${POSTGRES_DB:-atlas}
      ATLAS_POSTGRES__USER: ${POSTGRES_USER:-atlas}
      ATLAS_POSTGRES__PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      ATLAS_REDIS__HOST: redis
      ATLAS_REDIS__PORT: "6379"
      ATLAS_REDIS__DATABASE: "0"
      ATLAS_DUCKDB__PATH: /app/data/atlas.duckdb
      # Start-up builds the trading adapter these describe, so a container
      # without them exits 2. Interpolated rather than defaulted: a default
      # here would be a credential the repository invented, and a deployment
      # that cannot trade would look like one that can.
      ATLAS_BROKER__LOGIN: ${ATLAS_BROKER__LOGIN:?ATLAS_BROKER__LOGIN must be set in .env}
      ATLAS_BROKER__PASSWORD: ${ATLAS_BROKER__PASSWORD:?ATLAS_BROKER__PASSWORD must be set in .env}
      ATLAS_BROKER__SERVER: ${ATLAS_BROKER__SERVER:?ATLAS_BROKER__SERVER must be set in .env}
      ATLAS_BROKER__TERMINAL_PATH: ${ATLAS_BROKER__TERMINAL_PATH:?ATLAS_BROKER__TERMINAL_PATH must be set in .env}
    volumes:
      - atlas-data:/app/data
    networks:
      - atlas
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: atlas-postgres-data
  redis-data:
    name: atlas-redis-data
  atlas-data:
    name: atlas-core-data

networks:
  atlas:
    name: atlas
    driver: bridge

; MyPy — strict static typing for Project Atlas.
; The monorepo uses the PEP 420 namespace package `atlas`, so every package
; source root must be on mypy_path (comma-separated for cross-platform use).

[mypy]
python_version = 3.12
namespace_packages = True
explicit_package_bases = True
mypy_path =
    packages/common/src,
    packages/config/src,
    packages/events/src,
    packages/broker/src,
    packages/market/src,
    packages/features/src,
    packages/regime/src,
    packages/strategy/src,
    packages/ai/src,
    packages/risk/src,
    packages/execution/src,
    packages/notification/src,
    packages/analytics/src,
    packages/learning/src,
    packages/audit/src,
    apps/atlas-core/src,
    apps/dashboard/src,
    apps/research/src

strict = True
warn_unreachable = True
warn_no_return = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True
show_error_codes = True
show_column_numbers = True
pretty = True

plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

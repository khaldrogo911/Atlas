name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run on the same ref is wasted compute; cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Poetry must exist before setup-python so that `cache: poetry` can find
      # poetry.lock and key the dependency cache on it.
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Verify the lock file matches pyproject.toml
        run: poetry check --lock

      # `poetry sync`, not `poetry install --sync`: the flag is deprecated as of
      # Poetry 2.x and warns on every run.
      - name: Install dependencies
        run: poetry sync --with dev,test

      # Every stage below is a hard gate. No `continue-on-error` anywhere: the
      # first failure stops the job.
      - name: Ruff
        run: poetry run ruff check --output-format=github .

      - name: Black
        run: poetry run black --check --diff .

      - name: MyPy
        run: poetry run mypy .

      - name: Pytest
        run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Container & Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    # Throwaway broker configuration, supplied the way a deployment supplies
    # real values rather than baked into the repository. ATLAS-TASK-0023 made
    # start-up construct the trading adapter, so a container without these four
    # exits 2 before it reports anything. They are stated explicitly rather than
    # leaning on the empty-password and empty-path values MT5Config currently
    # accepts, so that tightening either one does not silently break this job.
    #
    # Compose reads them from this environment; the steps below hand them to
    # `docker run` by name.
    env:
      ATLAS_BROKER__LOGIN: "1000001"
      ATLAS_BROKER__PASSWORD: ci-throwaway-broker
      ATLAS_BROKER__SERVER: CI-Throwaway
      ATLAS_BROKER__TERMINAL_PATH: /opt/atlas/ci/terminal64.exe
      ATLAS_BROKER__DEVIATION_POINTS: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Compose interpolation fails closed on a missing POSTGRES_PASSWORD, so
      # CI supplies a throwaway value the same way an operator supplies a real
      # one. Nothing here is a default baked into the repository. It fails
      # closed on the four broker values too; those come from this job's
      # environment, which compose reads ahead of `.env`.
      - name: Materialise a CI environment file
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-throwaway-$RANDOM/" .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build the atlas-core image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: atlas/atlas-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint is a start-up check. Running it proves the image can
      # resolve settings, that its invariants hold, that the broker section it
      # was given translates into an adapter — and, since ADR-0017, that the
      # process goes on to open the session that adapter describes.
      #
      # It cannot open one here, and that is the point. MetaTrader5 publishes
      # Windows wheels only, so `pyproject.toml` marks it `sys_platform ==
      # "win32"` and this Linux image has no terminal to reach. A fully
      # configured container therefore exits 3 by design, and exit 3 is the
      # furthest a Linux runner can observe: everything up to the venue is
      # proved here, and the session itself is proved on a Windows host or not
      # at all. An exit 0 from this step would mean the entrypoint stopped
      # opening a session, not that CI found a broker.
      #
      # The streams are captured apart rather than merged, because "stdout
      # stayed empty" is half of what this step exists to show and merging them
      # would destroy the evidence for it.
      - name: Run the image start-up check with broker configuration
        run: |
          status=0
          docker run --rm \
            -e ATLAS_ENV=development \
            -e ATLAS_POSTGRES__PASSWORD=ci-throwaway \
            -e ATLAS_BROKER__LOGIN \
            -e ATLAS_BROKER__PASSWORD \
            -e ATLAS_BROKER__SERVER \
            -e ATLAS_BROKER__TERMINAL_PATH \
            -e ATLAS_BROKER__DEVIATION_POINTS \
            atlas/atlas-core:ci >configured.out 2>configured.err || status=$?
          STATUS="$status" python3 - <<'PY'
          import json
          import os
          import pathlib

          out = pathlib.Path("configured.out").read_text()
          err = pathlib.Path("configured.err").read_text()

          # Checked before either stream is echoed, so a leak is never printed.
          # The password is the one value with no licence to appear anywhere:
          # ADR-0017 allows the `error` field to name the account, because the
          # terminal's own message does, and stdout is proved empty below, which
          # covers the remaining two on the only stream that could carry them.
          if os.environ["ATLAS_BROKER__PASSWORD"] in out + err:
              raise SystemExit("the refused session leaked the broker password")

          status = int(os.environ["STATUS"])
          if status != 3:
              raise SystemExit(f"expected exit 3, got {status}: {err}")

          if out.strip():
              raise SystemExit(f"a refused session wrote to stdout: {out!r}")

          lines = [line for line in err.splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit(f"expected one failure record, got {len(lines)}")

          record = json.loads(lines[0])
          if record["event"] != "atlas.core.broker_connect_failed":
              raise SystemExit(f"unexpected event: {record['event']!r}")

          print(lines[0])
          PY

      # Until ADR-0017 the step above ended at the startup record and checked
      # the two things about it an exit code cannot show: that it still carries
      # the eight keys ATLAS-TASK-0001 defined, and that none of the broker
      # configuration reached it. A container that now stops at the venue can
      # never emit that record, so the check is kept here rather than dropped —
      # same image, same configured environment, same public function the
      # entrypoint calls, one step short of the session it cannot open.
      - name: Verify the image still builds its startup record
        run: |
          record=$(docker run --rm -i \
            -e ATLAS_ENV=development \
            -e ATLAS_POSTGRES__PASSWORD=ci-throwaway \
            -e ATLAS_BROKER__LOGIN \
            -e ATLAS_BROKER__PASSWORD \
            -e ATLAS_BROKER__SERVER \
            -e ATLAS_BROKER__TERMINAL_PATH \
            --entrypoint python \
            atlas/atlas-core:ci - <<'IMAGE'
          import json

          from atlas.apps.core.__main__ import build_startup_record
          from atlas.config import load_settings

          print(json.dumps(build_startup_record(load_settings())))
          IMAGE
          )
          RECORD="$record" python3 - <<'PY'
          import json
          import os

          lines = [line for line in os.environ["RECORD"].splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit(f"expected one startup record, got {len(lines)}")

          rendered = lines[0]
          # Checked before the record is echoed, so a leak is never printed.
          for name in (
              "ATLAS_BROKER__LOGIN",
              "ATLAS_BROKER__PASSWORD",
              "ATLAS_BROKER__SERVER",
              "ATLAS_BROKER__TERMINAL_PATH",
          ):
              if os.environ[name] in rendered:
                  raise SystemExit(f"the startup record carried {name}")

          record = json.loads(rendered)
          if record["event"] != "atlas.core.startup":
              raise SystemExit(f"unexpected event: {record['event']!r}")

          expected = {
              "event",
              "app_name",
              "environment",
              "debug",
              "logging",
              "postgres",
              "redis",
              "duckdb",
          }
          if set(record) != expected:
              raise SystemExit(f"the startup record's keys changed: {sorted(record)}")

          print(rendered)
          PY

      # ATLAS-TASK-0023 decided that a process without usable broker
      # configuration does not start. That refusal is worth observing rather
      # than assuming, and the check above cannot observe it. A password is
      # supplied and nothing else, so the failure has a credential available to
      # leak and is shown not to leak it.
      - name: Run the image self-check without broker configuration
        run: |
          status=0
          output=$(docker run --rm \
            -e ATLAS_ENV=development \
            -e ATLAS_POSTGRES__PASSWORD=ci-throwaway \
            -e ATLAS_BROKER__PASSWORD \
            atlas/atlas-core:ci 2>&1) || status=$?
          OUTPUT="$output" STATUS="$status" python3 - <<'PY'
          import json
          import os

          output = os.environ["OUTPUT"]
          if os.environ["ATLAS_BROKER__PASSWORD"] in output:
              raise SystemExit("the failing start-up leaked the broker password")

          status = int(os.environ["STATUS"])
          if status != 2:
              raise SystemExit(f"expected exit 2, got {status}: {output}")

          # stderr was merged into stdout, so one line also proves the record
          # ATLAS-TASK-0001 writes to stdout was never reached.
          lines = [line for line in output.splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit(f"expected one failure record, got {len(lines)}")

          record = json.loads(lines[0])
          if record["event"] != "atlas.core.startup_failed":
              raise SystemExit(f"unexpected event: {record['event']!r}")

          print(lines[0])
          PY

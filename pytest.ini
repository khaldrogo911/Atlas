[pytest]
minversion = 8.0
testpaths = tests

; importlib import mode keeps the test tree free of __init__.py files and
; prevents test packages from shadowing the `atlas` namespace.
addopts =
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --showlocals

markers =
    unit: isolated, no I/O, no external services.
    integration: requires a real PostgreSQL/Redis/DuckDB instance.
    contract: verifies repository and package structural invariants.
    e2e: exercises a full deployed stack.

asyncio_mode = strict
filterwarnings =
    error
    ignore::DeprecationWarning:pkg_resources
xfail_strict = True
